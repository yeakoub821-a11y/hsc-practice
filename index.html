  app.innerHTML='<h1>পরীক্ষা</h1><p class="sub">মোট প্রশ্ন: '+B(Q.length)+' · প্রতি প্রশ্নে ৫৫ সেকেন্ড</p><div class="tm" id="tm"></div>'+Q.map(function(o,i){
    return '<div class="card"><div class="tg">'+o.ch+'</div><div class="q">'+B(i+1)+'. '+esc(o.q[0])+'</div>'+o.q[1].map(function(t,j){return '<label class="op" data-i="'+i+'"><input type="radio" name="q'+i+'" value="'+j+'"> '+esc(t)+'</label>'}).join('')+'</div>'}).join('')+
  '<button class="btn" id="sub">জমা দাও</button><button class="btn g" id="bk">জমা দিয়ে বের হও</button>';
  app.querySelectorAll('input[type=radio]').forEach(function(r){r.onchange=function(){var i=+r.name.slice(1);A[i]=+r.value;lk();
    app.querySelectorAll('.op[data-i="'+i+'"]').forEach(function(l){l.classList.toggle('sel',l.contains(r)&&r.checked)})}});
  document.getElementById('bk').onclick=function(){ask('জমা দিয়ে বের হবে? আর পরীক্ষায় ফেরা যাবে না।',result)};
  document.getElementById('sub').onclick=function(){
    var un=A.filter(function(a){return a<0}).length;
    if(un){ask(B(un)+'টি প্রশ্নের উত্তর দাওনি। জমা দেবে?',result);return}result()};
  startT();window.scrollTo(0,0);
}
var TI=null;
var T='ভার্সিটি',TY={'এসএসসি':'এসএসসি (নবম-দশম শ্রেণির পাঠ্যবইয়ের মানের, সহজ থেকে মাঝারি)','ভার্সিটি':'ভার্সিটি (সাধারণ বিশ্ববিদ্যালয় ভর্তি পরীক্ষা মানের, মাঝারি থেকে কঠিন)','মেডিকেল':'মেডিকেল (MBBS ভর্তি পরীক্ষা মানের, ধারণা ও তথ্যনির্ভর)','ইঞ্জিনিয়ারিং':'ইঞ্জিনিয়ারিং (বুয়েট ও ইঞ্জিনিয়ারিং ভর্তি পরীক্ষা মানের, গণনাভিত্তিক ও কঠিন)'};
function dropMem(t){ALLD().forEach(function(X){Object.keys(X).forEach(function(s){Object.keys(X[s]).forEach(function(p){Object.keys(X[s][p]).forEach(function(c){X[s][p][c]=X[s][p][c].filter(function(q){return t.indexOf(q[0])<0})})})})})}
function drop(list){var t=list.map(function(o){return o.q[0]});dropMem(t);try{var g=JSON.parse(localStorage.getItem('hscGone')||'[]');localStorage.setItem('hscGone',JSON.stringify(g.concat(t)));var o=JSON.parse(localStorage.getItem('hscCustom')||'[]');localStorage.setItem('hscCustom',JSON.stringify(o.filter(function(x){return t.indexOf(x.q)<0})))}catch(e){}}
function srcTxt(o){return o.source?'AI-এর তথ্য (যাচাই করে নিও): '+o.source:''}
function cnt(a){return a.filter(function(q){return !q[4]||q[4]==T}).length}
function shuf(a){return a.slice().sort(function(){return Math.random()-.5})}
function prep(l){return shuf(l).map(function(o){var q=o.q,ix=shuf([0,1,2,3]);return {q:[q[0],ix.map(function(i){return q[1][i]}),ix.indexOf(q[2]),q[3],q[4],q[5]],ch:o.ch,s:o.s,p:o.p}})}
function toItem(o){return {q:[o.q,o.options,o.answer,o.explanation,o.type||T,srcTxt(o)],ch:o.chapter||'AI প্রশ্ন',s:o.subject,p:o.paper}}
function valid(a){return (a||[]).filter(function(o){return o&&o.q&&Array.isArray(o.options)&&o.options.length==4&&Number.isInteger(o.answer)&&o.answer>=0&&o.answer<4&&o.explanation})}
function f2(x){return String(Math.round(x*100)/100)}
function histAdd(e){try{var h=JSON.parse(localStorage.getItem('hscHist')||'[]');h.unshift(e);localStorage.setItem('hscHist',JSON.stringify(h.slice(0,100)))}catch(x){}}
function histView(){
  var h=[];try{h=JSON.parse(localStorage.getItem('hscHist')||'[]')}catch(x){}
  var pc=h.map(function(e){return e.m/e.n*100}),tot=h.length,avg=tot?pc.reduce(function(a,b){return a+b},0)/tot:0,best=tot?Math.max.apply(null,pc):0;
  app.innerHTML='<h1>📊 পরীক্ষার ইতিহাস</h1>'+(tot?'<div class="card sc"><div class="st"><span>মোট পরীক্ষা<br><b style="font-size:24px">'+tot+'</b></span><span>গড় স্কোর<br><b style="font-size:24px">'+avg.toFixed(0)+'%</b></span><span>সর্বোচ্চ<br><b style="font-size:24px">'+best.toFixed(0)+'%</b></span></div></div>':'<div class="card">এখনো কোনো পরীক্ষা দাওনি।</div>')+
  h.map(function(e){var d=new Date(e.d);return '<div class="card"><div class="tg">'+d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear()+' · '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')+' · '+esc(e.ty)+'</div><div><b>'+f2(e.m)+' / '+e.n+'</b> <span class="tg">(সঠিক '+e.c+', ভুল '+e.w+', বাদ '+e.u+')</span></div><div class="tg">'+esc(e.ch.join(', '))+'</div></div>'}).join('')+
  (tot?'<button class="btn g" id="clr">ইতিহাস মুছে ফেলো</button>':'')+'<button class="btn" id="hm2">← ফিরে যাও</button>';
  document.getElementById('hm2').onclick=home;
  var c=document.getElementById('clr');if(c)c.onclick=function(){ask('সব ইতিহাস মুছে যাবে। নিশ্চিত?',function(){try{localStorage.removeItem('hscHist')}catch(x){}histView()})};
}
function retry(){Q=prep(shuf(Q.slice()));A=Q.map(function(){return -1});exam()}
function ask(m,y){var o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:99';
o.innerHTML='<div class="card" style="max-width:420px"><div id="am" style="margin-bottom:6px"></div><button class="btn" id="ay">ঠিক আছে</button>'+(y?'<button class="btn g" id="an">বাতিল</button>':'')+'</div>';
document.body.appendChild(o);o.querySelector('#am').textContent=m;
o.querySelector('#ay').onclick=function(){o.remove();if(y)y()};var n=o.querySelector('#an');if(n)n.onclick=function(){o.remove()}}
function lk(){try{localStorage.setItem('hscLive',JSON.stringify({Q:Q,A:A}))}catch(e){}}
function unlk(){try{localStorage.removeItem('hscLive')}catch(e){}}
['contextmenu','copy','cut','dragstart'].forEach(function(n){document.addEventListener(n,function(ev){if(ev.target.tagName!='TEXTAREA')ev.preventDefault()})});
document.addEventListener('keydown',function(e){var k=(e.key||'').toLowerCase();if(e.target.tagName=='TEXTAREA')return;if(k=='printscreen'||((e.ctrlKey||e.metaKey)&&['p','s','c','u'].indexOf(k)>-1)||(e.metaKey&&e.shiftKey&&['3','4','5'].indexOf(k)>-1)){e.preventDefault();try{navigator.clipboard.writeText('')}catch(x){}}});
document.addEventListener('visibilitychange',function(){app.style.filter=document.hidden?'blur(16px)':'';});
function stopT(){if(TI){clearInterval(TI);TI=null}}
function startT(){
  stopT();lk();var end=Date.now()+Q.length*55000,el=document.getElementById('tm');
  function tick(){var s=Math.max(0,Math.ceil((end-Date.now())/1000));
    el.textContent='⏱ '+B(Math.floor(s/60))+':'+B(String(s%60).padStart(2,'0'));el.classList.toggle('lo',s<=60);
    if(s<=0){result();app.insertAdjacentHTML('afterbegin','<div class="card">⏰ সময় শেষ! তোমার উত্তরগুলো নিজে থেকে জমা হয়েছে।</div>')}}
  tick();TI=setInterval(tick,250);
}
function result(){
  stopT();unlk();
  var c=0,w=0,u=0;A.forEach(function(a,i){if(a<0)u++;else if(a==Q[i].q[2])c++;else w++});
  var m=c-w*0.25;histAdd({d:Date.now(),ty:T,ch:Q.map(function(o){return o.ch}).filter(function(x,i,a){return a.indexOf(x)==i}),n:Q.length,c:c,w:w,u:u,m:m});
  app.innerHTML='<div class="card sc"><div>তোমার প্রাপ্ত নম্বর</div><b>'+B(m.toFixed(2).replace(/\.00$/,'').replace(/(\.\d)0$/,'$1'))+'</b> / '+B(Q.length)+
  '<div class="st"><span style="color:var(--ok)">✔ সঠিক: '+B(c)+'</span><span style="color:var(--no)">✘ ভুল: '+B(w)+'</span><span>— বাদ: '+B(u)+'</span></div>'+
  '<div class="tg" style="margin-top:6px">ভুল থেকে কাটা: '+B((w*0.25).toFixed(2))+'</div></div><h2>উত্তর ও সমাধান</h2>'+
  Q.map(function(o,i){var q=o.q,a=A[i],ok=a==q[2];
    return '<div class="card"><div class="tg">'+o.ch+' · '+(a<0?'উত্তর দাওনি':ok?'✔ সঠিক':'✘ ভুল')+'</div><div class="q">'+B(i+1)+'. '+esc(q[0])+'</div>'+
    q[1].map(function(t,j){return '<div class="op '+(j==q[2]?'c':(j==a?'x':''))+'">'+esc(t)+(j==q[2]?' ✔':'')+(j==a&&!ok?' (তোমার উত্তর)':'')+'</div>'}).join('')+
    '<div class="ex"><b>সমাধান:</b> '+esc(q[3])+'</div>'+(q[5]?'<div class="tg" style="margin-top:6px">📍 '+esc(q[5])+'</div>':'')+'</div>'}).join('')+
  '<button class="btn" id="re">🔄 আবার পরীক্ষা দাও</button><button class="btn g" id="hm">নতুন অধ্যায় বেছে নাও</button>';
  document.getElementById('re').onclick=retry;
  document.getElementById('hm').onclick=home;window.scrollTo(0,0);
}
function addQ(o){var ss=o.level=='SSC',X=ss?DSSC:DHSC;var s=X[o.subject]?o.subject:'আমার প্রশ্ন';var p=ss?SP:(o.paper==='দ্বিতীয় পত্র'?'দ্বিতীয় পত্র':'প্রথম পত্র');
  if(!X[s])X[s]=ss?{'এসএসসি':{}}:{'প্রথম পত্র':{},'দ্বিতীয় পত্র':{}};var c=o.chapter||'AI প্রশ্ন';X[s][p][c]=X[s][p][c]||[];
  if(X[s][p][c].some(function(x){return x[0]==o.q}))return;X[s][p][c].push([o.q,o.options,o.answer,o.explanation,o.type,srcTxt(o)])}
function loadSaved(){try{JSON.parse(localStorage.getItem('hscCustom')||'[]').forEach(addQ)}catch(e){}
  try{var g=JSON.parse(localStorage.getItem('hscGone')||'[]');if(g.length)dropMem(g)}catch(e){}}
loadSaved();
welcome();
function fx(r){var w=document.createTreeWalker(r,NodeFilter.SHOW_TEXT),n,v;while((n=w.nextNode())){v=n.nodeValue.replace(/[০-৯]/g,EN);if(v!==n.nodeValue)n.nodeValue=v}}
new MutationObserver(function(){fx(app)}).observe(app,{childList:true,subtree:true,characterData:true});fx(app);
try{var lv=JSON.parse(localStorage.getItem('hscLive')||'null');if(lv&&lv.Q&&lv.Q.length){Q=lv.Q;A=lv.A;result();app.insertAdjacentHTML('afterbegin','<div class="card">🚪 তুমি আগের পরীক্ষা থেকে বের হয়ে গিয়েছিলে, তাই পরীক্ষা শেষ হয়ে গেছে। আর ঢোকা যাবে না।</div>')}}catch(e){}
</script></body></html>
