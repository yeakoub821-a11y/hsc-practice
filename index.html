  fresh.forEach(function(o){o.type=T});
  var rest=shuf(old).slice(0,Math.max(0,old.length-fresh.length));
  if(fresh.length){drop(old.filter(function(o){return rest.indexOf(o)<0}));genQ=fresh;saveGen()}
  Q=prep(fresh.map(toItem).concat(rest));A=Q.map(function(){return -1});
  if(fresh.length)exam();else ask('নতুন প্রশ্ন বানানো যায়নি (AI চালু নেই বা সমস্যা হয়েছে), তাই আগের প্রশ্নই নতুন ক্রমে দেওয়া হচ্ছে।',exam);
}
function ask(m,y){var o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:99';
o.innerHTML='<div class="card" style="max-width:420px"><div id="am" style="margin-bottom:6px"></div><button class="btn" id="ay">ঠিক আছে</button>'+(y?'<button class="btn g" id="an">বাতিল</button>':'')+'</div>';
document.body.appendChild(o);o.querySelector('#am').textContent=m;
o.querySelector('#ay').onclick=function(){o.remove();if(y)y()};var n=o.querySelector('#an');if(n)n.onclick=function(){o.remove()}}
function lk(){try{localStorage.setItem('hscLive',JSON.stringify({Q:Q,A:A}))}catch(e){}}
function unlk(){try{localStorage.removeItem('hscLive')}catch(e){}}
['contextmenu','copy','cut','dragstart'].forEach(function(n){document.addEventListener(n,function(ev){if(ev.target.tagName!='TEXTAREA')ev.preventDefault()})});

document.addEventListener('visibilitychange',function(){app.style.filter=document.hidden?'blur(16px)':'';});
function stopT(){if(TI){clearInterval(TI);TI=null}}

  tick();TI=setInterval(tick,250);

function result(){
  stopT();unlk();
  var c=0,w=0,u=0;A.forEach(function(a,i){if(a<0)u++;else if(a==Q[i].q[2])c++;else w++});
  var m=c-w*0.25;histAdd({d:Date.now(),ty:T,ch:Q.map(function(o){return o.ch}).filter(function(x,i,a){return a.indexOf(x)==i}),n:Q.length,c:c,w:w,u:u,m:m});
  app.innerHTML='<div class="card sc"><div>তোমার প্রাপ্ত নম্বর</div><b>'+B(m.toFixed(2).replace(/\.00$/,'').replace(/(\.\d)0$/,'$1'))+'</b> / '+B(Q.length)+
  '<div class="st"><span style="color:var(--ok)">✔ সঠিক: '+B(c)+'</span><span style="color:var(--no)">✘ ভুল: '+B(w)+'</span><span>— বাদ: '+B(u)+'</span></div>'+
  '<div class="tg" style="margin-top:6px">ভুল থেকে কাটা: '+B((w*0.25).toFixed(2))+'</div></div><h2>উত্তর ও সমাধান</h2>'+
  Q.map(function(o,i){var q=o.q,a=A[i],ok=a==q[2];
    return '<div class="card"><div class="tg">'+o.ch+' · '+(a<0?'উত্তর দাওনি':ok?'✔ সঠিক':'✘ ভুল')+'</div><div class="q">'+B(i+1)+'. '+esc(q[0])+'</div>'+
    q[1].map(function(t,j){return '<div class="op '+(j==q[2]?'c':(j==a?'x':''))+'">'+esc(t)+(j==q[2]?' ✔':'')+(j==a&&!ok?' (তোমার উত্তর)':'')+'</div>'}).join('')+
    '<div class="ex"><b>সমাধান:</b> '+esc(q[3])+'</div>'+(q[5]?'<div class="tg" style="margin-top:6px">📍 '+esc(q[5])+'</div>':'')+'</div>'}).join('')+
  '<button class="btn" id="re">🔄 আবার পরীক্ষা দাও (নতুন প্রশ্ন)</button><button class="btn g" id="hm">নতুন অধ্যায় বেছে নাও</button>';
  document.getElementById('re').onclick=retry;
  document.getElementById('hm').onclick=home;window.scrollTo(0,0);
}
var smp=null,hist=[],genQ=[];
var SYS='তুমি বাংলাদেশের HSC স্তরের পদার্থবিজ্ঞান, রসায়ন ও গণিতের শিক্ষক। ব্যবহারকারীর অনুরোধ অনুযায়ী MCQ বানাও। শুধু JSON ফেরত দাও, অন্য কোনো লেখা বা ```fence নয়: {"reply":"বাংলায় ছোট উত্তর","questions":[{"subject":"পদার্থবিজ্ঞান|রসায়ন|গণিত","paper":"প্রথম পত্র|দ্বিতীয় পত্র","chapter":"অধ্যায়ের নাম","q":"প্রশ্ন","options":["ক","খ","গ","ঘ"],"answer":0,"explanation":"ধাপে ধাপে সমাধান","source":""}]}। নিয়ম: সর্বোচ্চ ১৫টি প্রশ্ন; ঠিক ৪টি অপশন; answer হলো ০ থেকে ৩ সংখ্যা; বাংলায় লেখো কিন্তু সব সংখ্যা ইংরেজি অঙ্কে (0-9); উত্তর বসানোর আগে নিজে সমাধান করে যাচাই করো; প্রশ্ন চাওয়া না হলে questions খালি রাখো। source-এ শুধু তখনই বিশ্ববিদ্যালয়ের নাম ও সাল লেখো যখন প্রশ্নটি সত্যিই সেখানে এসেছিল বলে তুমি নিশ্চিত; অনুমান করে কখনো লিখো না, নিশ্চিত না হলে খালি রাখো।';
function addQ(o){var s=D[o.subject]?o.subject:'আমার প্রশ্ন';var p=o.paper==='দ্বিতীয় পত্র'?'দ্বিতীয় পত্র':'প্রথম পত্র';
  if(!D[s])D[s]={'প্রথম পত্র':{},'দ্বিতীয় পত্র':{}};var c=o.chapter||'AI প্রশ্ন';D[s][p][c]=D[s][p][c]||[];
  if(D[s][p][c].some(function(x){return x[0]==o.q}))return;D[s][p][c].push([o.q,o.options,o.answer,o.explanation,o.type,srcTxt(o)])}
function loadSaved(){try{JSON.parse(localStorage.getItem('hscCustom')||'[]').forEach(addQ)}catch(e){}
  try{var g=JSON.parse(localStorage.getItem('hscGone')||'[]');if(g.length)dropMem(g)}catch(e){}}
function saveGen(){genQ.forEach(addQ);try{var o=JSON.parse(localStorage.getItem('hscCustom')||'[]');localStorage.setItem('hscCustom',JSON.stringify(o.concat(genQ)));return true}catch(e){return false}}
function chat(){
  app.innerHTML='<h1>🤖 AI দিয়ে প্রশ্ন বানাও</h1><p class="sub">যেমন: "রসায়ন ২য় পত্র তড়িৎ রসায়ন থেকে ১০টা MCQ বানাও, মাঝারি কঠিন"। একবারে সর্বোচ্চ ১৫টা। AI-এর প্রশ্নে ভুল থাকতে পারে, বইয়ের সাথে মিলিয়ে নিও।</p><div id="log"></div><textarea id="t" rows="3" placeholder="কী ধরনের প্রশ্ন চাও লেখো..."></textarea><button class="btn" id="snd">পাঠাও</button><button class="btn g" id="hm">← ফিরে যাও</button>';
  document.getElementById('hm').onclick=home;document.getElementById('snd').onclick=send;
  hist.forEach(function(h){bub(h.role=='user'?'u':'a',h.content)});
}
function bub(c,t){var d=document.createElement('div');d.className='m '+c;d.textContent=t;document.getElementById('log').appendChild(d);return d}
async function send(){
  var ta=document.getElementById('t'),b=document.getElementById('snd'),t=ta.value.trim();if(!t)return;
  if(!smp){try{smp=await claude.use('sample')}catch(e){}}
  if(!smp){bub('a','AI সংযোগ পাওয়া যাচ্ছে না। claude.ai-তে লগইন থাকা অবস্থায় লিংকটা খুলে আবার চেষ্টা করো।');return}
  bub('u',t);ta.value='';b.disabled=true;var w=bub('a','ভাবছি...');
  var tr=hist.slice(-6).map(function(h){return (h.role=='user'?'ব্যবহারকারী: ':'সহকারী: ')+h.content}).join('\n');
  hist.push({role:'user',content:t});
  try{
    var r=await smp.json(SYS+'\n\nআগের কথোপকথন:\n'+tr+'\n\nনতুন অনুরোধ: '+t+' [প্রশ্নের ধরন: '+TY[T]+']');
    var qs=(r.questions||[]).filter(function(o){return o&&o.q&&Array.isArray(o.options)&&o.options.length==4&&Number.isInteger(o.answer)&&o.answer>=0&&o.answer<4&&o.explanation});
    w.textContent=(r.reply||'')+(qs.length?'\n\n✅ '+B(qs.length)+'টি প্রশ্ন তৈরি হয়েছে।':'');hist.push({role:'assistant',content:r.reply||''});
    if(qs.length){qs.forEach(function(o){o.type=T});genQ=qs;var x=document.createElement('button');x.className='btn';x.textContent='▶ এগুলো দিয়ে পরীক্ষা দাও';
      x.onclick=function(){Q=prep(genQ.map(toItem));A=Q.map(function(){return -1});exam()};
      var y=document.createElement('button');y.className='btn g';y.textContent='💾 অধ্যায়ে সেভ করো';
      y.onclick=function(){y.textContent=saveGen()?'✔ সেভ হয়েছে (শুধু এই ফোনে)':'সেভ করা যায়নি';y.disabled=true};
      w.appendChild(x);w.appendChild(y)}
  }catch(e){w.textContent=(e&&e.code=='not_granted')?'অনুমতি দেওয়া হয়নি।':'কিছু একটা সমস্যা হয়েছে, আবার চেষ্টা করো।'}
  b.disabled=false;
}
loadSaved();
home();
function fx(r){var w=document.createTreeWalker(r,NodeFilter.SHOW_TEXT),n,v;while((n=w.nextNode())){v=n.nodeValue.replace(/[০-৯]/g,EN);if(v!==n.nodeValue)n.nodeValue=v}}
new MutationObserver(function(){fx(app)}).observe(app,{childList:true,subtree:true,characterData:true});fx(app);
